<title>Smoczy Box Score</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: tablica wyników Wisły — granatowy pas z następnym meczem i osią sezonu, pod nim zakładki Zawodnik / Drużyna / Liga */
:root{
  --bg:#f5f6f9; --surface:#ffffff; --surface-2:#eef0f6; --ink:#0d1a3a; --muted:#5a6482; --line:#d9dded;
  --red:#d3102a; --red-soft:#fbe5e8; --navy:#12224d; --ball:#e0702a; --good:#1f8a4c; --warn:#c77700; --bar:#8d96b3;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#080f22; --surface:#0f1a35; --surface-2:#16244a; --ink:#eef1fa; --muted:#9aa5c6; --line:#24335e;
  --red:#ff4057; --red-soft:#3a1424; --navy:#0a1330; --ball:#f08a45; --good:#4cc786; --warn:#f0a83a; --bar:#5d6a92; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080f22; --surface:#0f1a35; --surface-2:#16244a; --ink:#eef1fa; --muted:#9aa5c6; --line:#24335e;
  --red:#ff4057; --red-soft:#3a1424; --navy:#0a1330; --ball:#f08a45; --good:#4cc786; --warn:#f0a83a; --bar:#5d6a92; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.02em;line-height:1;margin:0;text-wrap:balance}
p{margin:0}
button,select{font:inherit}
:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}

/* top bar */
.top{background:var(--navy);color:#fff}
.top .wrap{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--f-display);font-weight:900;font-size:26px;text-transform:uppercase;letter-spacing:.03em}
.brand span{font-family:var(--f-mono);font-size:11px;color:#b9c2de;display:block}
.fresh{font-family:var(--f-mono);font-size:12px;color:#c6cde6;display:flex;flex-wrap:wrap;gap:4px 14px}
.fresh b{color:#7ee2a8;font-weight:500}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters label{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#b9c2de;display:grid;gap:3px}
.filters select{font-size:14px;background:#1b2c5e;color:#fff;border:1px solid #33467e;border-radius:6px;padding:5px 8px;max-width:220px}

/* fixture band */
.band{background:var(--surface-2);border-bottom:1px solid var(--line)}
.band .wrap{padding-block:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.band .wrap>*{min-width:0}
.view{grid-template-columns:minmax(0,1fr)}
.nextm{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.nextm{grid-template-columns:1fr}}
.nm-main{background:var(--red);color:#fff;border-radius:12px;padding:18px 20px;display:grid;gap:9px;position:relative;overflow:hidden;align-content:start}
.nm-main .lab{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#ffd6dc}
.nm-vs{font-family:var(--f-display);font-weight:900;font-size:clamp(26px,4vw,40px);text-transform:uppercase;line-height:.95}
.nm-vs small{display:block;font-size:.5em;font-weight:800;opacity:.8;margin:2px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-family:var(--f-mono);font-size:12px;background:rgba(255,255,255,.16);padding:4px 9px;border-radius:4px}
.chips .cd{background:#fff;color:#c00d24;font-weight:500}
.nm-hall{font-size:14px;color:#ffe1e5}
.nm-main svg.ballbg{position:absolute;right:-34px;bottom:-44px;width:160px;opacity:.14;pointer-events:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.panel h4{font-weight:800;font-size:17px}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini div{display:grid}
.mini b{font-family:var(--f-display);font-size:28px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.mini span{font-size:12px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;display:grid;font-size:14px}
.list li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:4px 0}
.list li:last-child{border-bottom:0}
.list em{font-style:normal;font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.note{font-size:13px;color:var(--muted)}

/* season line */
.sl-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline}
.sl-head h4{font-weight:800;font-size:17px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.season-line{overflow-x:auto;padding-bottom:4px}
.track{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(108px,1fr);gap:6px;position:relative;min-width:max-content}
.track::before{content:"";position:absolute;left:0;right:0;top:24px;height:2px;background:var(--line)}
.gm{position:relative;display:grid;justify-items:center;align-content:start;gap:4px;background:transparent;border:1px solid transparent;padding:0 4px 8px;cursor:pointer;color:var(--ink);border-radius:8px;min-width:108px}
.gm .ball{width:30px;height:30px;border-radius:50%;margin-top:9px;border:2px solid var(--muted);background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;color:var(--muted);z-index:1}
.gm.win .ball{background:var(--good);border-color:var(--good);color:#fff}
.gm.loss .ball{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.gm.next .ball{width:40px;height:40px;margin-top:4px;background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 0 5px var(--red-soft)}
.gm .dt{font-family:var(--f-mono);font-size:12px}
.gm .op{font-family:var(--f-display);font-weight:800;font-size:16px;text-transform:uppercase;line-height:1;text-align:center}
.gm .ha{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;padding:2px 6px;border-radius:3px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.gm .rs{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.gm.win .rs{color:var(--good);font-weight:500}
.gm[aria-pressed="true"]{background:var(--surface);border-color:var(--line)}
.gm[aria-pressed="true"] .op{color:var(--red)}
.pill{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:var(--ball);color:#fff;padding:2px 6px;border-radius:3px}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:grid;gap:4px;font-size:14px}
.detail .k{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.detail b{font-family:var(--f-display);font-size:19px;text-transform:uppercase}
.detail .chg{color:var(--ball);font-size:13px}
.detail a{color:var(--red)}

/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;padding-top:18px}
.tab{font-family:var(--f-display);font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.03em;background:transparent;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 14px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--red);border-bottom-color:var(--red)}
.tab:hover{color:var(--ink)}
main .wrap{padding-block:18px 48px}
.view{display:grid;gap:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:2px}
.kpi .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-weight:900;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:13px;color:var(--muted)}
.kpi.hl{background:var(--red);border-color:var(--red);color:#fff}
.kpi.hl .k,.kpi.hl .s{color:#ffd6dc}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:860px){.row2{grid-template-columns:1fr}}

.player{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
@media (max-width:560px){.player{grid-template-columns:1fr}}
.jersey{width:140px;max-width:100%}
.pname{font-family:var(--f-display);font-weight:900;font-size:clamp(36px,6vw,58px);text-transform:uppercase;line-height:.92}
.pmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pmeta span{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);padding:4px 9px;border-radius:4px}

.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:minmax(0,170px) 1fr 44px;gap:10px;align-items:center;font-size:14px;background:transparent;border:0;padding:0;color:inherit;text-align:left}
button.bar{cursor:pointer}
button.bar:hover .nm{color:var(--red)}
.bar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{height:14px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar .fl{height:100%;background:var(--bar);border-radius:3px}
.bar.me .fl{background:var(--red)}
.bar.me .nm{font-weight:600;color:var(--red)}
.bar .vl{font-family:var(--f-mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}

.fouls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pip{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pip.on{background:var(--warn);border-color:var(--warn);color:#fff}
.pip.out{border-style:dashed}
.pip.on.out{background:var(--red);border-color:var(--red);border-style:solid}

.score{background:#0a1330;color:#fff;border-radius:12px;padding:16px;display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center}
.score .t{font-family:var(--f-display);font-weight:800;font-size:clamp(15px,2.4vw,20px);text-transform:uppercase}
.score .n{font-family:var(--f-mono);font-size:clamp(32px,6vw,46px);color:#ffb347;letter-spacing:.04em;font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(255,179,71,.45)}
.score .n.w{color:#ff5b6e;text-shadow:0 0 12px rgba(255,91,110,.5)}
.score .mid{font-family:var(--f-mono);font-size:11px;color:#9aa5c6;display:block}
.qs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.qs span{font-family:var(--f-mono);font-size:11px;color:#c6cde6;border:1px solid #2b3a6a;border-radius:4px;padding:2px 6px}

@media (max-width:480px){.bar{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 40px;gap:8px;font-size:13.5px}}

.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.hl td{background:var(--red-soft);font-weight:600}
tr.hl td:first-child{box-shadow:inset 4px 0 0 var(--red)}
.form{display:inline-flex;gap:3px;vertical-align:middle}
.form i{width:18px;height:18px;border-radius:3px;font-style:normal;font-family:var(--f-mono);font-size:10px;display:grid;place-items:center;color:#fff}
.form .w{background:var(--good)} .form .l{background:var(--red)}
.wl{font-family:var(--f-mono);font-size:11px;padding:1px 5px;border-radius:3px;color:#fff}
.wl.w{background:var(--good)} .wl.l{background:var(--red)}
details.others{border:1px dashed var(--line);border-radius:10px;padding:10px 16px;background:var(--surface)}
details.others summary{cursor:pointer;font-family:var(--f-display);font-weight:800;font-size:17px;text-transform:uppercase;color:var(--muted)}
details.others[open] summary{margin-bottom:10px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.ctl select{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.empty{padding:18px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center}
.warn{background:var(--red-soft);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:13px}
svg text{font-family:var(--f-mono)}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
footer .wrap{padding-block:20px;display:grid;gap:4px}
footer a{color:inherit}
</style>

<header class="top"><div class="wrap">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 20.9l1.6-7L2 9.2l7.1-.6z" fill="#d3102a"/></svg>
    <div><b>Smoczy Box Score</b><span id="league-label"></span></div>
  </div>
  <div class="fresh" id="fresh"></div>
  <div class="filters">
    <label for="f-team">Drużyna<select id="f-team"></select></label>
    <label for="f-player">Zawodnik<select id="f-player"></select></label>
  </div>
</div></header>

<section class="band" aria-label="Terminarz drużyny"><div class="wrap" id="band"></div></section>

<main><div class="wrap">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-player" aria-controls="v-player">Zawodnik</button>
    <button class="tab" role="tab" id="t-team" aria-controls="v-team">Drużyna</button>
    <button class="tab" role="tab" id="t-league" aria-controls="v-league">Liga</button>
  </div>
  <div class="view" id="v-player" role="tabpanel" aria-labelledby="t-player"></div>
  <div class="view" id="v-team" role="tabpanel" aria-labelledby="t-team" hidden></div>
  <div class="view" id="v-league" role="tabpanel" aria-labelledby="t-league" hidden></div>
</div></main>

<footer><div class="wrap" id="foot"></div></footer>

<script>window.SMOKI_DATA = null;</script>
<script>
(function(){
'use strict';
var D = window.SMOKI_DATA;
if(!D){document.getElementById('band').innerHTML='<div class="empty">Brak danych. Uruchom scripts\\update.ps1, aby pobrać dane z kozkosz.pl.</div>';return;}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(id){return document.getElementById(id);}
var DOW=['niedz.','pon.','wt.','śr.','czw.','pt.','sob.'];
function dDate(iso){if(!iso)return '—';var p=iso.split('-');return p[2]+'.'+p[1];}
function dFull(iso){if(!iso)return 'termin do ustalenia';var d=new Date(iso+'T12:00:00');var p=iso.split('-');return DOW[d.getDay()]+' '+p[2]+'.'+p[1]+'.'+p[0];}
function fmt1(x){return (Math.round(x*10)/10).toFixed(1);}
function pct(x){return (Math.round(x*1000)/10).toFixed(1).replace('.',',')+'%';}
function today(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
function daysTo(iso){if(!iso)return null;var p=iso.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);return Math.round((d-today())/86400000);}
function cdText(n){if(n==null)return 'termin do ustalenia';if(n===0)return 'dziś';if(n===1)return 'jutro';if(n<0)return 'po terminie';return 'za '+n+' dni';}
function T(id){return D.teams[id]||{id:id,name:'Drużyna '+id,short:'Drużyna '+id};}
function sn(id){return T(id).short;}
function srcUrl(path){return 'https://www.kozkosz.pl'+path;}
function surname(n){var p=String(n).split(' ');return p.length>1?p[0].charAt(0)+'. '+p.slice(1).join(' '):n;}

/* ---------- model ---------- */
var matches=D.matches.slice().sort(function(a,b){return ((a.date||'9999')+(a.time||'99:99')).localeCompare((b.date||'9999')+(b.time||'99:99'));});
var byId={};matches.forEach(function(m){byId[m.id]=m;});
var changesBy={};(D.changes||[]).forEach(function(c){(changesBy[c.matchId]=changesBy[c.matchId]||[]).push(c);});
var groupOf={};D.groups.forEach(function(g){g.teamIds.forEach(function(t){groupOf[t]=g;});});

var P={}; // players
var TS={}; // team stats
Object.keys(D.teams).forEach(function(id){TS[id]={id:id,g:0,w:0,l:0,pf:0,pa:0,fouls:0,boxGames:0,log:[]};});
matches.forEach(function(m){
  if(!m.played)return;
  [['home','away'],['away','home']].forEach(function(s){
    var tid=m[s[0]],oid=m[s[1]],my=s[0]==='home'?m.sh:m.sa,op=s[0]==='home'?m.sa:m.sh;
    var t=TS[tid];if(!t)return;
    t.g++;t.pf+=my;t.pa+=op;if(my>op)t.w++;else t.l++;
    t.log.push({m:m,opp:oid,home:s[0]==='home',my:my,op:op,win:my>op});
    var rows=m.box&&m.box[s[0]]||[];
    if(rows.length){t.boxGames++;}
    rows.forEach(function(r){
      t.fouls+=r.f;
      var p=P[r.pid]||(P[r.pid]={id:r.pid,name:r.name,teamId:tid,nr:r.nr,games:0,pts:0,p3:0,f:0,log:[]});
      p.games++;p.pts+=r.pts;p.p3+=r.p3;p.f+=r.f;p.nr=r.nr||p.nr;p.teamId=tid;
      p.log.push({m:m,opp:oid,home:s[0]==='home',pts:r.pts,p3:r.p3,f:r.f,teamPts:my,win:my>op,my:my,op:op});
    });
  });
});
var plist=Object.keys(P).map(function(k){return P[k];});
plist.forEach(function(p){p.avg=p.games?p.pts/p.games:0;});
plist.forEach(function(p){p.rank=1+plist.filter(function(q){return q.pts>p.pts;}).length;});
var noBox=matches.filter(function(m){return m.played&&!((m.box&&m.box.home||[]).length+(m.box&&m.box.away||[]).length);});
var ROM={I:1,II:2,III:3,IV:4,V:5,VI:6,VII:7,VIII:8,IX:9,X:10,XI:11,XII:12,XIII:13,XIV:14,XV:15,XVI:16,XVII:17,XVIII:18,XIX:19,XX:20};
function rnd(r){var x=String(r||'').replace('Kolejka ','');return 'K'+(ROM[x]||x);}
function teamPlayers(tid){
  var list=plist.filter(function(p){return p.teamId===tid;});
  var r=D.roster&&D.roster[tid];
  if(r){r.forEach(function(x){if(!P[x.id]){list.push({id:x.id,name:x.name,teamId:tid,nr:'',games:0,pts:0,p3:0,f:0,avg:0,log:[],rank:null});}});}
  return list.sort(function(a,b){return b.pts-a.pts||a.name.localeCompare(b.name,'pl');});
}
function getPlayer(id,tid){if(P[id])return P[id];var r=(D.roster&&D.roster[tid])||[];for(var i=0;i<r.length;i++){if(r[i].id===id)return {id:id,name:r[i].name,teamId:tid,nr:'',games:0,pts:0,p3:0,f:0,avg:0,log:[],rank:null};}return null;}
function teamMatches(tid){return matches.filter(function(m){return m.home===tid||m.away===tid;});}
function standRow(tid){var g=groupOf[tid];if(!g)return null;var rows=(D.standings||{})[g.id]||[];for(var i=0;i<rows.length;i++){if(rows[i].teamId===tid)return rows[i];}return null;}
function topScorers(tid,n){return plist.filter(function(p){return p.teamId===tid&&p.games>0;}).sort(function(a,b){return b.avg-a.avg;}).slice(0,n);}
function h2h(a,b){return matches.filter(function(m){return m.played&&((m.home===a&&m.away===b)||(m.home===b&&m.away===a));});}
function nextMatch(tid){var t=today().toISOString?null:null;var list=teamMatches(tid).filter(function(m){return !m.played&&(m.date==null||daysTo(m.date)>=0);});return list[0]||null;}
function isChanged(m){return m.moved||!!changesBy[m.id];}

/* ---------- state ---------- */

try{var sv=JSON.parse(localStorage.getItem('smoki-state')||'{}');if(sv.team&&D.teams[sv.team])S.team=sv.team;if(sv.player)S.player=sv.player;if(sv.tab)S.tab=sv.tab;}catch(e){}
var h=(location.hash||'').replace('#','');if(['player','team','league'].indexOf(h)>=0)S.tab=h;
function save(){try{localStorage.setItem('smoki-state',JSON.stringify({team:S.team,player:S.player,tab:S.tab}));}catch(e){}}

/* ---------- header ---------- */
$('league-label').textContent=D.league.name+' · KOZKosz '+D.league.season;
(function(){
  var g=new Date(D.generatedAt);var p=function(n){return (n<10?'0':'')+n;};

/* ---------- band: next match + season line ---------- */
function ballSvg(){return '<svg class="ballbg" viewBox="0 0 100 100" aria-hidden="true" fill="none" stroke="#fff" stroke-width="5"><circle cx="50" cy="50" r="45"/><path d="M5 50h90M50 5v90M18 18c18 18 18 46 0 64M82 18c-18 18-18 46 0 64"/></svg>';}
function scoutHtml(tid,opp){
  var st=standRow(opp),ts=TS[opp],g=groupOf[opp];
  var tops=topScorers(opp,3),prev=h2h(tid,opp);
  var s='<div class="panel"><h4>Zapowiedź rywala · '+esc(sn(opp))+'</h4><div class="mini">';
  s+='<div><b>'+(st?st.rank+'.':'–')+'</b><span>w grupie '+esc(g?g.letter:'')+'</span></div>';
  s+='<div><b>'+(ts?ts.w+'–'+ts.l:'–')+'</b><span>bilans</span></div>';
  s+='<div><b>'+(ts&&ts.g?fmt1(ts.pf/ts.g):'–')+'</b><span>pkt / mecz</span></div></div>';
  if(tops.length){s+='<ul class="list">'+tops.map(function(p){return '<li><span>'+(p.nr?'#'+esc(p.nr)+' ':'')+esc(p.name)+'</span><em>'+fmt1(p.avg)+' pkt/m</em></li>';}).join('')+'</ul>';}
  else s+='<p class="note">Rywal nie rozegrał jeszcze meczu z protokołem.</p>';
  if(prev.length){s+='<p class="note">Poprzednio: '+prev.map(function(m){return esc(sn(m.home))+' – '+esc(sn(m.away))+' '+m.sh+':'+m.sa+' ('+dDate(m.date)+')';}).join(', ')+'</p>';}
  else s+='<p class="note">Pierwszy mecz tych drużyn w sezonie.</p>';
  if(ts&&ts.g){s+='<p class="note">Średnio traci '+fmt1(ts.pa/ts.g)+' pkt na mecz.</p>';}
  return s+'</div>';
}
function renderBand(){
  var tid=S.team,tm=teamMatches(tid),nm=nextMatch(tid),s='';
  if(nm){
    var home=nm.home===tid,opp=home?nm.away:nm.home,dt=daysTo(nm.date);
    s+='<div class="nextm"><div class="nm-main">'+ballSvg()+'<span class="lab">Następny mecz · '+esc(sn(tid))+' · grupa '+esc(groupOf[tid]?groupOf[tid].letter:'')+' · '+esc(nm.round)+'</span>';
    s+='<span class="nm-vs">'+esc(T(nm.home).name)+'<small>vs</small>'+esc(T(nm.away).name)+'</span>';
    s+='<div class="chips"><span class="cd">'+esc(cdText(dt))+'</span><span>'+esc(dFull(nm.date))+'</span><span>'+esc(nm.time||'godz. do potwierdzenia')+'</span><span>'+(home?'DOM':'WYJAZD')+'</span>'+(isChanged(nm)?'<span class="cd">zmiana terminu</span>':'')+'</div>';
    s+='<span class="nm-hall">'+esc(nm.hall||'Hala do potwierdzenia')+'</span></div>'+scoutHtml(tid,opp)+'</div>';
  }else{
    var ts=TS[tid];
    s+='<div class="panel"><h4>Koniec rundy · '+esc(T(tid).name)+'</h4><p class="note">Brak zaplanowanych meczów w terminarzu. Bilans: '+(ts?ts.w+'–'+ts.l:'–')+', kosze '+(ts?ts.pf+':'+ts.pa:'–')+'.</p></div>';
  }
  s+='<div><div class="sl-head"><h4>Sezon '+esc(sn(tid))+' · '+tm.length+' meczów</h4><div class="legend"><span><i style="background:var(--good)"></i>wygrana</span><span><i style="background:var(--ink)"></i>porażka</span><span><i style="background:var(--red)"></i>następny</span><span><i style="border:2px solid var(--muted)"></i>zaplanowany</span><span><span class="pill">zmiana</span> nowy termin</span></div></div>';
  s+='<div class="season-line"><div class="track">';
  tm.forEach(function(m){
    var home=m.home===tid,opp=home?m.away:m.home,cls='gm',ball='',rs='';
    if(m.played){var my=home?m.sh:m.sa,op=home?m.sa:m.sh,w=my>op;cls+=w?' win':' loss';ball=w?'W':'P';rs=my+':'+op;}
    else{ball=rnd(m.round);rs=m.time||'godz. —';}
    if(nm&&m.id===nm.id)cls+=' next';
    var selId=S.sel||(nm?nm.id:(tm.length?tm[tm.length-1].id:null));
    s+='<button class="'+cls+'" data-m="'+esc(m.id)+'" aria-pressed="'+(m.id===selId)+'"><span class="ball">'+esc(ball)+'</span><span class="dt">'+dDate(m.date)+'</span><span class="op">'+esc(sn(opp))+'</span><span class="ha">'+(home?'DOM':'WYJ')+'</span><span class="rs">'+esc(rs)+'</span>'+(isChanged(m)&&!m.played?'<span class="pill">zmiana</span>':'')+'</button>';
  });
  s+='</div></div><div class="detail" id="mdetail" aria-live="polite"></div></div>';
  $('band').innerHTML=s;
  [].forEach.call(document.querySelectorAll('#band .gm'),function(b){b.addEventListener('click',function(){S.sel=b.getAttribute('data-m');[].forEach.call(document.querySelectorAll('#band .gm'),function(x){x.setAttribute('aria-pressed',x===b);});detail();});});
  detail();
}
function detail(){
  var tid=S.team,nm=nextMatch(tid),tm=teamMatches(tid);
  var id=S.sel||(nm?nm.id:(tm.length?tm[tm.length-1].id:null));var m=byId[id];var el=$('mdetail');
  if(!m){el.hidden=true;return;}el.hidden=false;
  var home=m.home===tid,opp=home?m.away:m.home,s='<span class="k">'+esc(m.round)+' · '+esc(dFull(m.date))+(m.time?' '+esc(m.time):'')+' · '+(home?'dom':'wyjazd')+'</span>';
  s+='<b>'+esc(T(m.home).name)+' – '+esc(T(m.away).name)+(m.played?' '+m.sh+':'+m.sa:'')+'</b>';
  if(m.played){
    var my=home?m.sh:m.sa,op=home?m.sa:m.sh,rows=(m.box&&m.box[home?'home':'away'])||[];
    var best=rows.slice().sort(function(a,b){return b.pts-a.pts;})[0];
    var tp=S.player&&rows.filter(function(r){return r.pid===S.player;})[0];
    if(!rows.length)s+='<span class="chg">Protokół z punktami zawodników nie jest jeszcze wpisany na kozkosz.pl.</span>';
    s+='<span>'+(my>op?'Wygrana':'Porażka')+' '+my+':'+op+(m.quarters?' · kwarty: '+esc(m.quarters):'')+'.'+(best?' Najwięcej punktów: '+esc(best.name)+' ('+best.pts+').':'')+(tp?' '+esc(tp.name)+': '+tp.pts+' pkt, '+tp.f+' f.':'')+'</span>';
  }else{
    var st=standRow(opp),tops=topScorers(opp,1);
    s+='<span>'+esc(m.hall||'Hala do potwierdzenia')+'.'+(st?' Rywal: '+st.rank+'. w grupie, bilans '+st.w+'–'+st.l+'.':'')+(tops.length?' Lider: '+esc(tops[0].name)+' ('+fmt1(tops[0].avg)+' pkt/m).':'')+'</span>';
  }
  (changesBy[m.id]||[]).forEach(function(c){var lab={date:'data',time:'godzina',hall:'hala'}[c.field]||c.field;s+='<span class="chg">Zmiana ('+esc(lab)+'): '+esc(c.field==='date'?dDate(c.from):c.from)+' → '+esc(c.field==='date'?dDate(c.to):c.to)+'</span>';});
  if(m.moved&&!m.played)s+='<span class="chg">kozkosz.pl oznacza ten mecz jako przełożony.</span>';
  s+='<span><a href="'+esc(srcUrl(m.path))+'" target="_blank" rel="noopener">'+(m.played?'Protokół meczu na kozkosz.pl':'Strona meczu na kozkosz.pl')+'</a></span>';
  el.innerHTML=s;

/* ---------- player view ---------- */
function jersey(nr,name){
  var last=String(name||'').split(' ').slice(-1)[0].toUpperCase();
  return '<svg class="jersey" viewBox="0 0 160 170" role="img" aria-label="Koszulka z numerem '+esc(nr||'')+'"><path d="M40 8 L62 8 Q80 30 98 8 L120 8 L150 40 L132 62 L124 54 L124 162 L36 162 L36 54 L28 62 L10 40 Z" fill="var(--red)"/><path d="M62 8 Q80 30 98 8" fill="none" stroke="#fff" stroke-width="4"/><rect x="36" y="140" width="88" height="6" fill="#fff" opacity=".9"/><rect x="36" y="150" width="88" height="4" fill="var(--navy)"/><text x="80" y="114" text-anchor="middle" font-family="Big Shoulders Display, Impact, sans-serif" font-weight="900" font-size="64" fill="#fff">'+esc(nr||'?')+'</text><text x="80" y="52" text-anchor="middle" font-family="Big Shoulders Display, Impact, sans-serif" font-weight="800" font-size="13" fill="#fff" letter-spacing="1">'+esc(last)+'</text></svg>';
}
function trendSvg(log,avg){
  if(!log.length)return '';
  var W=Math.max(320,log.length*64),H=170,pl=30,pr=10,pt=14,pb=34,max=Math.max(10,Math.ceil(Math.max.apply(null,log.map(function(l){return l.pts;}))/5)*5);
  var cw=(W-pl-pr)/log.length,y=function(v){return pt+(H-pt-pb)*(1-v/max);};
  var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+Math.min(W,320)+'px;height:auto" role="img" aria-label="Punkty w kolejnych meczach">';
  for(var t=0;t<=max;t+=max/2){s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="var(--line)"/><text x="'+(pl-6)+'" y="'+(y(t)+4)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+t+'</text>';}
  log.forEach(function(l,i){var x=pl+i*cw+cw*0.2,bw=cw*0.6;s+='<rect x="'+x+'" y="'+y(l.pts)+'" width="'+bw+'" height="'+(y(0)-y(l.pts))+'" rx="3" fill="'+(i===log.length-1?'var(--red)':'var(--bar)')+'"/><text x="'+(x+bw/2)+'" y="'+(y(l.pts)-4)+'" text-anchor="middle" font-size="11" fill="var(--ink)">'+l.pts+'</text><text x="'+(x+bw/2)+'" y="'+(H-18)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+dDate(l.m.date)+'</text><text x="'+(x+bw/2)+'" y="'+(H-6)+'" text-anchor="middle" font-size="9" fill="var(--muted)">'+esc(sn(l.opp).slice(0,10))+'</text>';});
  s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(avg)+'" y2="'+y(avg)+'" stroke="var(--ball)" stroke-width="2" stroke-dasharray="5 4"/><text x="'+(W-pr)+'" y="'+(y(avg)-5)+'" text-anchor="end" font-size="10" fill="var(--ball)">śr. '+fmt1(avg)+'</text>';
  return s+'</svg>';
}
function renderPlayer(){
  var el=$('v-player'),p=getPlayer(S.player,S.team);
  if(!p){el.innerHTML='<div class="empty">Wybierz zawodnika z listy u góry.</div>';return;}
  var prof=(D.profiles||{})[p.id]||null,ts=TS[p.teamId]||{pf:0,g:0},rost=((D.roster||{})[p.teamId]||[]).filter(function(r){return r.id===p.id;})[0];
  var nr=(prof&&prof.number)||p.nr,pos=(prof&&prof.position)||(rost&&rost.position),hgt=(prof&&prof.height)||(rost&&rost.height);
  var teamRank=teamPlayers(p.teamId).filter(function(x){return x.games>0;}).indexOf(p)+1;
  var share=ts.pf&&p.games?p.pts/p.log.reduce(function(a,l){return a+l.teamPts;},0):0;
  var s='<div class="player">'+jersey(nr,p.name)+'<div><p class="eyebrow">'+esc(T(p.teamId).name)+(pos?' · '+esc(pos):'')+'</p><p class="pname">'+esc(p.name).replace(' ','<br>')+'</p><div class="pmeta">';
  if(prof&&prof.born)s+='<span>rocznik '+esc(prof.born)+'</span>';
  if(hgt)s+='<span>'+esc(hgt)+'</span>';
  if(nr)s+='<span>#'+esc(nr)+'</span>';
  if(teamRank>0)s+='<span>'+teamRank+'. strzelec drużyny</span>';
  s+='</div></div></div>';
  if(!p.games){el.innerHTML=s+'<div class="empty">Ten zawodnik nie ma jeszcze meczu z protokołem w tym sezonie.</div>';return;}
  var hist=prof&&prof.history||[],prev=hist.filter(function(h){return h.season!==D.league.season;})[0];
  var last=p.log[p.log.length-1],l3=p.log.slice(-3),f3=l3.reduce(function(a,l){return a+l.pts;},0)/l3.length;
  s+='<div class="kpis">';
  s+='<div class="kpi hl"><span class="k">Punkty / mecz</span><span class="v">'+fmt1(p.avg)+'</span><span class="s">'+(prev&&prev.games?esc(prev.season)+': '+fmt1(prev.pts/prev.games):p.games+' mecz(e), '+p.pts+' pkt')+'</span></div>';
  s+='<div class="kpi"><span class="k">Udział w pkt drużyny</span><span class="v">'+pct(share)+'</span><span class="s">'+p.pts+' z '+p.log.reduce(function(a,l){return a+l.teamPts;},0)+'</span></div>';
  s+='<div class="kpi"><span class="k">Ranking ligi (suma)</span><span class="v">'+p.rank+'.</span><span class="s">z '+plist.length+' zawodników</span></div>';
  s+='<div class="kpi"><span class="k">Forma · ost. '+l3.length+'</span><span class="v">'+fmt1(f3)+'</span><span class="s">'+(f3>p.avg+0.5?'powyżej':f3<p.avg-0.5?'poniżej':'na poziomie')+' średniej</span></div>';
  s+='<div class="kpi"><span class="k">Faule / mecz</span><span class="v">'+fmt1(p.f/p.games)+'</span><span class="s">'+p.log.filter(function(l){return l.f>=4;}).length+' mecz(e) z 4+ faulami</span></div>';
  s+='</div><div class="row2">';
  s+='<div class="panel"><h4>Punkty mecz po meczu</h4><div class="tbl">'+trendSvg(p.log,p.avg)+'</div></div>';
  s+='<div class="panel"><h4>Licznik fauli · '+dDate(last.m.date)+' vs '+esc(sn(last.opp))+'</h4><div class="fouls" aria-label="'+last.f+' z 5 fauli">';
  for(var i=1;i<=5;i++)s+='<span class="pip'+(i<=last.f?' on':'')+(i===5?' out':'')+'">'+i+'</span>';
  s+='</div><p class="note">'+(last.f>=5?'Zejście za 5 fauli.':last.f===4?'Gra na krawędzi: jeszcze jeden faul i zejście.':'Bezpieczny poziom fauli.')+'</p>';
  if(hist.length){var mx=Math.max.apply(null,hist.map(function(h){return h.games?h.pts/h.games:0;}))||1;s+='<h4 style="margin-top:8px">Sezon do sezonu</h4><div class="bars">'+hist.slice().reverse().map(function(h){var a=h.games?h.pts/h.games:0;return '<div class="bar'+(h.season===D.league.season?' me':'')+'"><span class="nm">'+esc(h.season)+' · '+esc(h.team)+'</span><div class="tr"><div class="fl" style="width:'+(a/mx*100)+'%"></div></div><span class="vl">'+fmt1(a)+'</span></div>';}).join('')+'</div><p class="note">Średnia punktów na mecz według profilu na kozkosz.pl.</p>';}
  s+='</div></div>';
  s+='<div class="panel"><h4>Mecz po meczu</h4><div class="tbl"><table><thead><tr><th>Data</th><th>Rywal</th><th>Wynik</th><th class="n">Pkt</th><th class="n">Za 3</th><th class="n">F</th><th class="n">% pkt drużyny</th></tr></thead><tbody>';
  p.log.slice().reverse().forEach(function(l){s+='<tr><td class="num">'+dDate(l.m.date)+'</td><td>'+esc(T(l.opp).name)+' ('+(l.home?'d':'w')+')</td><td><span class="wl '+(l.win?'w':'l')+'">'+(l.win?'W':'P')+'</span> '+l.my+':'+l.op+'</td><td class="n">'+l.pts+'</td><td class="n">'+(l.p3||'–')+'</td><td class="n">'+l.f+'</td><td class="n">'+pct(l.teamPts?l.pts/l.teamPts:0)+'</td></tr>';});
  s+='</tbody></table></div></div>';
  var up=teamMatches(p.teamId).filter(function(m){return !m.played&&(m.date==null||daysTo(m.date)>=0);}).slice(0,3);
  if(up.length){
    s+='<div class="panel"><h4>Najbliżsi rywale · kogo pilnować</h4><div class="tbl"><table><thead><tr><th>Data</th><th>Rywal</th><th>Najlepszy strzelec rywala</th><th class="n">Śr. pkt</th><th class="n">Faule/m</th></tr></thead><tbody>';
    up.forEach(function(m){var opp=m.home===p.teamId?m.away:m.home,t=topScorers(opp,1)[0];s+='<tr><td class="num">'+dDate(m.date)+'</td><td>'+esc(T(opp).name)+'</td><td>'+(t?(t.nr?'#'+esc(t.nr)+' ':'')+esc(t.name):'<span class="muted">brak meczów w sezonie</span>')+'</td><td class="n">'+(t?fmt1(t.avg):'–')+'</td><td class="n">'+(t?fmt1(t.f/t.games):'–')+'</td></tr>';});
    s+='</tbody></table></div><p class="note">Rozgrywający często kryje lidera rywala, dlatego przy każdym meczu widać, kto zdobywa najwięcej punktów.</p></div>';
  }
  el.innerHTML=s;
}

function standTable(gid,hl){

  var s='<div class="tbl"><table><thead><tr><th>#</th><th>Drużyna</th><th class="n">M</th><th class="n">Pkt</th><th class="n">Bilans</th><th class="n">Dom</th><th class="n">Wyjazd</th><th class="n">Kosze</th><th class="n">+/−</th><th>Forma</th></tr></thead><tbody>';
  rows.forEach(function(r){var lg=(TS[r.teamId]||{log:[]}).log.slice(-5);s+='<tr class="'+(r.teamId===hl?'hl':'')+'"><td>'+r.rank+'</td><td>'+esc(T(r.teamId).name)+'</td><td class="n">'+r.g+'</td><td class="n">'+r.pts+'</td><td class="n">'+r.w+'–'+r.l+'</td><td class="n">'+r.hw+'–'+r.hl+'</td><td class="n">'+r.aw+'–'+r.al+'</td><td class="n">'+r.pf+':'+r.pa+'</td><td class="n">'+(r.diff>0?'+':'')+r.diff+'</td><td><span class="form">'+lg.map(function(x){return '<i class="'+(x.win?'w':'l')+'">'+(x.win?'W':'P')+'</i>';}).join('')+'</span></td></tr>';});
  (g?g.teamIds:[]).filter(function(t){return !inTable[t];}).forEach(function(t){s+='<tr class="'+(t===hl?'hl':'')+'"><td>–</td><td>'+esc(T(t).name)+'</td><td class="n">0</td><td class="n">0</td><td class="n">0–0</td><td class="n">0–0</td><td class="n">0–0</td><td class="n">0:0</td><td class="n">0</td><td></td></tr>';});
  return s+'</tbody></table></div>';
}
function resList(list,tid){
  if(!list.length)return '<p class="note">Brak meczów.</p>';
  return '<div class="tbl"><table><tbody>'+list.map(function(m){return '<tr><td class="num">'+dDate(m.date)+(m.time?' '+esc(m.time):'')+'</td><td>'+esc(T(m.home).name)+' – '+esc(T(m.away).name)+(isChanged(m)&&!m.played?' <span class="pill">zmiana</span>':'')+'</td><td class="n">'+(m.played?m.sh+':'+m.sa:'--:--')+'</td></tr>';}).join('')+'</tbody></table></div>';
}
function renderTeam(){
  var el=$('v-team'),tid=S.team,ts=TS[tid],st=standRow(tid),g=groupOf[tid],s='';
  var last=ts.log[ts.log.length-1];
  if(last){
    var m=last.m,hw=m.sh>m.sa;
    s+='<div class="score" aria-label="Ostatni mecz"><span class="t">'+esc(T(m.home).name)+'</span><span><span class="n'+(hw?' w':'')+'">'+m.sh+'</span><span class="n">:</span><span class="n'+(!hw?' w':'')+'">'+m.sa+'</span><span class="mid">'+dDate(m.date)+' · '+esc(m.round)+' · ostatni mecz</span>'+(m.quarters?'<span class="qs">'+m.quarters.split(',').map(function(q,i){return '<span>Q'+(i+1)+' '+esc(q.trim())+'</span>';}).join('')+'</span>':'')+'</span><span class="t">'+esc(T(m.away).name)+'</span></div>';
  }
  var lg=plist.filter(function(p){return p.games>0;});var allPf=0,allG=0;Object.keys(TS).forEach(function(k){allPf+=TS[k].pf;allG+=TS[k].g;});
  s+='<div class="kpis"><div class="kpi hl"><span class="k">Bilans</span><span class="v">'+ts.w+'–'+ts.l+'</span><span class="s">'+(st?st.rank+'. miejsce w grupie '+esc(g.letter):'grupa '+esc(g?g.letter:''))+'</span></div>';
  s+='<div class="kpi"><span class="k">Pkt zdobyte / mecz</span><span class="v">'+(ts.g?fmt1(ts.pf/ts.g):'–')+'</span><span class="s">liga: '+(allG?fmt1(allPf/allG):'–')+'</span></div>';
  s+='<div class="kpi"><span class="k">Pkt stracone / mecz</span><span class="v">'+(ts.g?fmt1(ts.pa/ts.g):'–')+'</span><span class="s">różnica '+((ts.pf-ts.pa)>0?'+':'')+(ts.pf-ts.pa)+'</span></div>';
  s+='<div class="kpi"><span class="k">Faule / mecz</span><span class="v">'+(ts.boxGames?fmt1(ts.fouls/ts.boxGames):'–')+'</span><span class="s">z protokołów</span></div></div>';
  var pl=teamPlayers(tid).filter(function(p){return p.games>0;});
  if(pl.length){
    var mx=pl[0].pts||1;
    s+='<div class="panel"><h4>Kto zdobywa punkty · sezon</h4><div class="bars">';
    pl.forEach(function(p){s+='<button class="bar'+(p.id===S.player?' me':'')+'" data-p="'+esc(p.id)+'"><span class="nm">'+(p.nr?'#'+esc(p.nr)+' ':'')+esc(p.name)+'</span><span class="tr"><span class="fl" style="display:block;width:'+(p.pts/mx*100)+'%"></span></span><span class="vl">'+p.pts+'</span></button>';});
    s+='</div><p class="note">Suma punktów w sezonie. Kliknij zawodnika, aby otworzyć jego kartę.</p></div>';
  }
  s+='<div class="row2"><div class="panel"><h4>Grupa '+esc(g?g.letter:'')+'</h4>'+(g?standTable(g.id,tid):'')+'</div>';
  var riv=matches.filter(function(m){return groupOf[m.home]===g&&m.home!==tid&&m.away!==tid;});
  var rp=riv.filter(function(m){return m.played;}).slice(-4),ru=riv.filter(function(m){return !m.played&&(m.date==null||daysTo(m.date)>=0);}).slice(0,4);
  s+='<div class="panel"><h4>Rywale z grupy · wyniki i terminy</h4>'+resList(rp.concat(ru),tid)+'<p class="note">Mecze bez udziału '+esc(sn(tid))+', które zmieniają sytuację w tabeli grupy.</p></div></div>';
  el.innerHTML=s;
  [].forEach.call(el.querySelectorAll('button.bar'),function(b){b.addEventListener('click',function(){S.player=b.getAttribute('data-p');playerSel.value=S.player;save();renderPlayer();setTab('player');});});
}

/* ---------- league view ---------- */
function renderLeague(){
  var el=$('v-league'),played=matches.filter(function(m){return m.played;}),s='';
  var big=played.slice().sort(function(a,b){return Math.max(b.sh,b.sa)-Math.max(a.sh,a.sa);})[0];
  var close=played.slice().sort(function(a,b){return Math.abs(a.sh-a.sa)-Math.abs(b.sh-b.sa);})[0];
  s+='<div class="kpis"><div class="kpi"><span class="k">Drużyny</span><span class="v">'+Object.keys(D.teams).length+'</span><span class="s">'+D.groups.length+' grupy</span></div>';
  s+='<div class="kpi"><span class="k">Rozegrane mecze</span><span class="v">'+played.length+'</span><span class="s">z '+matches.length+' w rundzie</span></div>';
  if(big)s+='<div class="kpi"><span class="k">Najwyższy wynik</span><span class="v">'+Math.max(big.sh,big.sa)+'</span><span class="s">'+esc(sn(big.sh>big.sa?big.home:big.away))+' · '+dDate(big.date)+'</span></div>';
  if(close)s+='<div class="kpi hl"><span class="k">Najbardziej wyrównany mecz</span><span class="v">'+Math.abs(close.sh-close.sa)+' pkt</span><span class="s">różnicy · '+esc(sn(close.home))+' – '+esc(sn(close.away))+' '+close.sh+':'+close.sa+' ('+dDate(close.date)+')</span></div>';
  s+='</div><div class="row2"><div class="panel"><h4>Top strzelcy · śr. pkt</h4><div class="ctl"><label for="mingames">Min. meczów</label><select id="mingames">'+[1,2,3,4,5].map(function(n){return '<option'+(n===S.minGames?' selected':'')+'>'+n+'</option>';}).join('')+'</select></div><div class="bars" id="topbars"></div><p class="note">Zaznaczony zawodnik jest zawsze dopięty do listy.</p></div>';
  var tl=Object.keys(TS).map(function(k){return TS[k];}).filter(function(t){return t.g>0;}).sort(function(a,b){return (b.pf-b.pa)-(a.pf-a.pa);});
  var mxd=Math.max.apply(null,tl.map(function(t){return Math.abs(t.pf-t.pa);}).concat([1]));
  s+='<div class="panel"><h4>Różnica koszy · wszystkie drużyny</h4><svg viewBox="0 0 420 '+(tl.length*22+10)+'" style="width:100%;height:auto" role="img" aria-label="Różnica koszy drużyn">';
  tl.forEach(function(t,i){var d=t.pf-t.pa,y=i*22+6,w=Math.abs(d)/mxd*120,me=t.id===S.team;s+='<text x="150" y="'+(y+12)+'" text-anchor="end" font-size="11" fill="'+(me?'var(--red)':'var(--ink)')+'">'+esc(sn(t.id).slice(0,18))+'</text><rect x="'+(d>=0?280:280-w)+'" y="'+(y+2)+'" width="'+Math.max(w,1.5)+'" height="13" rx="2" fill="'+(me?'var(--red)':d>=0?'var(--good)':'var(--bar)')+'"/><text x="'+(d>=0?284+w:276-w)+'" y="'+(y+12)+'" text-anchor="'+(d>=0?'start':'end')+'" font-size="10" fill="var(--muted)">'+(d>0?'+':'')+d+'</text>';});
  s+='<line x1="280" x2="280" y1="0" y2="'+(tl.length*22+10)+'" stroke="var(--line)"/></svg></div></div>';
  D.groups.forEach(function(g){s+='<div class="panel"><h4>'+esc(g.name)+'</h4>'+standTable(g.id,S.team)+'</div>';});
  var tid=S.team,others=matches.filter(function(m){return m.home!==tid&&m.away!==tid;});
  var op=others.filter(function(m){return m.played;}).slice(-10).reverse(),ou=others.filter(function(m){return !m.played&&(m.date==null||daysTo(m.date)>=0);}).slice(0,10);
  s+='<details class="others"><summary>Pozostałe mecze ligi · w tle</summary><div class="row2"><div><h4 style="margin-bottom:6px">Ostatnie wyniki</h4>'+resList(op)+'</div><div><h4 style="margin-bottom:6px">Nadchodzące</h4>'+resList(ou)+'</div></div></details>';
  if(noBox.length)s+='<div class="warn"><b>Brak protokołu z punktami zawodników:</b> '+noBox.map(function(m){return esc(T(m.home).name)+' – '+esc(T(m.away).name)+' '+m.sh+':'+m.sa+' ('+dDate(m.date)+')';}).join('; ')+'. Wynik jest w tabeli, ale punkty zawodników dojdą po uzupełnieniu protokołu na kozkosz.pl.</div>';
  el.innerHTML=s;
  function tops(){
    var list=plist.filter(function(p){return p.games>=S.minGames;}).sort(function(a,b){return b.avg-a.avg||b.pts-a.pts;}),top=list.slice(0,10),me=getPlayer(S.player,S.team);
    if(me&&me.games&&top.indexOf(me)<0)top.push(me);
    var mx=top.length?Math.max.apply(null,top.map(function(p){return p.avg;})):1;
    $('topbars').innerHTML=top.map(function(p){return '<div class="bar'+(me&&p.id===me.id?' me':'')+'"><span class="nm">'+esc(surname(p.name))+' · '+esc(sn(p.teamId))+'</span><div class="tr"><div class="fl" style="width:'+(p.avg/mx*100)+'%"></div></div><span class="vl">'+fmt1(p.avg)+'</span></div>';}).join('')||'<p class="note">Brak zawodników z taką liczbą meczów.</p>';
  }
  $('mingames').addEventListener('change',function(e){S.minGames=+e.target.value;tops();});
  tops();
}

/* ---------- tabs & footer ---------- */
var tabs=[].slice.call(document.querySelectorAll('.tab'));
function setTab(name){S.tab=name;save();tabs.forEach(function(t){var on=t.id==='t-'+name;t.setAttribute('aria-selected',on);$(t.getAttribute('aria-controls')).hidden=!on;});}
tabs.forEach(function(t){t.addEventListener('click',function(){setTab(t.id.slice(2));});});
$('foot').innerHTML='<span>Źródło: <a href="'+esc(D.league.source)+'" target="_blank" rel="noopener">kozkosz.pl · '+esc(D.league.name)+' '+esc(D.league.season)+'</a>. Statystyki wyliczone z protokołów meczowych (punkty, celne za 3, faule). Protokoły oznaczone „niezweryfikowane” mogą się jeszcze zmienić.</span><span>Prywatny dashboard drużyny. Nie zawiera dat urodzenia ani danych kontaktowych zawodników.</span>';

function renderAll(){renderBand();renderPlayer();renderTeam();renderLeague();}
fillTeams();fillPlayers();renderAll();setTab(S.tab);
})();
</script>
