# Aktualizacja dashboardu i publikacja na GitHub Pages.
# Godziny w UTC: 04:00 UTC = 06:00 latem i 05:00 zima w Polsce; 20:00 UTC = 22:00 latem i 21:00 zima.
# Cogodzinne uruchomienie najpierw sprawdza terminarz (scripts/should-run.ps1) i robi pelna
# aktualizacje tylko 2 h po rozpoczeciu meczu (oraz ponownie 4 h po, jesli brak wyniku/protokolu).
name: Aktualizacja dashboardu

on:
  schedule:
    - cron: "0 4 * * *"      # codziennie rano
    - cron: "0 20 * * 6,0"   # sobota i niedziela wieczorem
    - cron: "7,27,47 * * * *" # co 20 min: czy jakis mecz czeka na wynik (GitHub czesto pomija uruchomienia, stad gesto)
  workflow_dispatch:         # reczne uruchomienie z zakladki Actions
    inputs:
      test_check:
        description: "Test: zachowaj sie jak sprawdzenie co 20 min (aktualizuj tylko, gdy mecz czeka na wynik)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Czy aktualizowac teraz?
        id: check
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'schedule' -and '${{ github.event.schedule }}' -eq '7,27,47 * * * *' -or '${{ inputs.test_check }}' -eq 'true') {
            ./scripts/should-run.ps1 | Out-Null
          } else {
            "run=true" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          }

      - name: Pobierz dane i zbuduj strone
        id: upd
        if: steps.check.outputs.run == 'true'
        continue-on-error: true
        shell: pwsh
        run: ./scripts/update.ps1

      # gdy kozkosz.pl nie odpowiada: zbuduj strone z poprzednimi danymi, zeby zmiany wygladu i tak trafily na strone
      - name: Zbuduj strone z poprzednimi danymi
        if: steps.check.outputs.run == 'true' && steps.upd.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Output "::warning::Nie udalo sie pobrac danych z kozkosz.pl - strona zbudowana z poprzednimi danymi."
          ./scripts/build.ps1

      # Dwa uruchomienia naraz (np. cron GitHuba i wywolanie z cron-job.org): jesli inne juz zapisalo
      # nowsze dane, nie nadpisuj ich i nie publikuj starszej strony - zakoncz bez bledu.
      - name: Zapisz dane w repozytorium (historia i cache)
        id: save
        if: steps.check.outputs.run == 'true'
        run: |
          git config user.name "smoki-bot"
          git config user.email "smoki-bot@users.noreply.github.com"
          git fetch -q origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::notice::Inne uruchomienie zapisalo juz nowsze dane - pomijam zapis i publikacje."
            echo "pub=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git add data
          git diff --cached --quiet || git commit -m "Dane z $(date -u +%F)"
          if ! git push; then
            echo "::notice::Inne uruchomienie zapisalo dane w tej samej chwili - pomijam zapis i publikacje."
            echo "pub=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "pub=true" >> "$GITHUB_OUTPUT"

      - if: steps.save.outputs.pub == 'true'
        uses: actions/configure-pages@v6
      - if: steps.save.outputs.pub == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      # GitHub nie widzi artefaktu od razu po wgraniu - krotka pauza przed wdrozeniem
      - if: steps.save.outputs.pub == 'true'
        run: sleep 20
      - id: deployment
        if: steps.save.outputs.pub == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v5
      # ponowienie wdrozenia, gdy GitHub chwilowo nie widzi artefaktu
      - if: steps.save.outputs.pub == 'true' && steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment2
        if: steps.save.outputs.pub == 'true' && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
