# Aktualizacja dashboardu i publikacja na GitHub Pages.
# Godziny w UTC: 04:00 UTC = 06:00 latem i 05:00 zima w Polsce; 20:00 UTC = 22:00 latem i 21:00 zima.
# Cogodzinne uruchomienie najpierw sprawdza terminarz (scripts/should-run.ps1) i robi pelna
# aktualizacje tylko 2 h po rozpoczeciu meczu (oraz ponownie 4 h po, jesli brak wyniku/protokolu).
name: Aktualizacja dashboardu

on:
  schedule:
    - cron: "0 4 * * *"      # codziennie rano
    - cron: "0 20 * * 6,0"   # sobota i niedziela wieczorem
    - cron: "10 * * * *"     # co godzine: sprawdzenie, czy minely 2 h od meczu
  workflow_dispatch: {}      # reczne uruchomienie z zakladki Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Czy aktualizowac teraz?
        id: check
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'schedule' -and '${{ github.event.schedule }}' -eq '10 * * * *') {
            ./scripts/should-run.ps1 | Out-Null
          } else {
            "run=true" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          }

      - name: Pobierz dane i zbuduj strone
        if: steps.check.outputs.run == 'true'
        shell: pwsh
        run: ./scripts/update.ps1

      - name: Zapisz dane w repozytorium (historia i cache)
        if: steps.check.outputs.run == 'true'
        run: |
          git config user.name "smoki-bot"
          git config user.email "smoki-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Dane z $(date -u +%F)"
          git push

      - if: steps.check.outputs.run == 'true'
        uses: actions/configure-pages@v6
      - if: steps.check.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        if: steps.check.outputs.run == 'true'
        uses: actions/deploy-pages@v5
